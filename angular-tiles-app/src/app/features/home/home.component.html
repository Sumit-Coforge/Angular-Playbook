<section class="hero">
  <h1>Angular Feature Playground</h1>
  <p>A single sample app demonstrating routing, standalone components, signals, observables, pipes, forms and directives.</p>
</section>

<div class="tiles">
  @for (tile of tiles; track tile.route) {
    <a class="tile" [routerLink]="tile.route" [style.--accent]="tile.accent">
      <span class="tile__icon">{{ tile.icon }}</span>
      <h2 class="tile__title">{{ tile.title }}</h2>
      <p class="tile__description">{{ tile.description }}</p>
      <div class="tile__tags">
        @for (tag of tile.tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>
    </a>
  }
</div>
